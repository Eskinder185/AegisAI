<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AegisAI: safely test your defenses, understand every finding, verify every improvement. A lab-bound AI security validation platform." />
    <meta name="theme-color" content="#07090f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AegisAI — Safely test your defenses</title>
    <script>
      try {
        var t = localStorage.getItem('aegis-theme') || 'dark';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
